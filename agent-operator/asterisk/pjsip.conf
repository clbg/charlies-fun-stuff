; ── Transport ────────────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ── Auth ────────────────────────────────────────────────────
[linphone-auth]
type=auth
auth_type=userpass
username=linphone
password=linphone123

; ── AoR ─────────────────────────────────────────────────────
[linphone]
type=aor
max_contacts=1

; ── Endpoint ────────────────────────────────────────────────
[linphone]
type=endpoint
context=phonebot
disallow=all
allow=ulaw
auth=linphone-auth
aors=linphone
