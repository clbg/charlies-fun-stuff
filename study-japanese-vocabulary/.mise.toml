[tools]
python = "3.12"

[env]
_.file = ".env"
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }
PYTHONPATH = "{{config_root}}/.."

[tasks.install]
description = "Install Python dependencies into the mise-managed venv"
run = "python -m pip install -r requirements.txt"

[tasks.generate]
description = "Generate Japanese vocabulary Anki cards"
run = "python generate_anki_cards.py"

[tasks.debug]
description = "Generate a small debug set"
run = "python generate_anki_cards.py --debug"
