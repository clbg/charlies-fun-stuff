appId: com.undercurrent.app
productName: Undercurrent
directories:
  output: dist
asar: false
files:
  - electron/main.js
  - package.json
  - server-bundle/**
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.icns
dmg:
  title: Undercurrent
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file
