# Auto-deploys japanese-reader/cf to Cloudflare Workers on push to main.
# Requires repo Secrets: CLOUDFLARE_API_TOKEN (scoped: Edit Workers + D1), CLOUDFLARE_ACCOUNT_ID.
# GEMINI_API_KEY is NOT set here — it lives on the Worker via `wrangler secret put`.
name: Deploy Japanese Reader (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "japanese-reader/cf/**"
      - ".github/workflows/japanese-reader-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: japanese-reader/cf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: japanese-reader/cf/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      # Apply any pending D1 migrations to the remote database before deploying.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply japanese-reader --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: japanese-reader/cf
          command: deploy
# Notes:
#   - GEMINI_API_KEY is NOT set here. Set it once on the Worker:
#       wrangler secret put GEMINI_API_KEY
#   - CLOUDFLARE_API_TOKEN (scoped to "Edit Cloudflare Workers" + D1) and
#     CLOUDFLARE_ACCOUNT_ID go in the GitHub repo Secrets.
